site_name: 爱果核资源库

site_url: https://lovefruitmr64-tech.github.io/blog/

theme:
  name: material
  language: zh

  custom_dir: docs/overrides

  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking

  palette:                                 # 👈 顶部添加改变明暗开关
    
    # Palette toggle for light mode
    - scheme: default
      primary: white
      accent: white
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode    


plugins:

  - search:
      lang:
        - zh
  
  - tags

  - blog:
      blog_dir: posts
      post_date_format: yyyy-MM-dd


markdown_extensions:

  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight


nav:                             # 👈 首页顶部导航

  - 首页:
      - 首页: index.md


  - 软件:
      - 软件资源: software/index.md


  - 游戏:
      - 游戏资源: game/index.md


  - 教程:
      - 教程资源: tutorial/index.md


  - 资源:
      - 综合资源: resource/index.md



extra_css:

  - css/custom.css

  - stylesheets/extra.css


extra_javascript:

  - js/home.js



copyright:

  Copyright © 2026 我的资源站



extra:

  generator: false
