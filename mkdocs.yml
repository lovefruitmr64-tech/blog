site_name: K资源仓

site_url: https://kzyc.de5.net/

theme:
  name: material
  logo: assets/images/logo.png
  font:
    text: Roboto
    code: Roboto Mono
  language: zh

  custom_dir: docs/overrides

  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking

  palette:                                 # 👈 顶部添加改变明暗开关
    
    # Palette toggle for light mode
    - scheme: default
      primary: white
      accent: white
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode    


plugins:

  - search:
      lang:
        - zh
  
  - tags:
      tags_file: tags.md

  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      
  
      
    


markdown_extensions:

  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight


nav:                             # 👈 首页顶部导航

  - 首页:
      - 首页: index.md

  - 最新发布:
      - 最新发布: blog/index.md

  - 电脑软件:
      - 电脑软件: software/index.md


  - 安卓软件:
      - 安卓软件: game/index.md


  - 操作系统:
      - 操作系统: tutorial/index.md


  - 其他软件:
      - 其他软件: resource/index.md


  - 视频教程:
      - 视频教程: game/index.md


  - 技术教程:
      - 技术教程: tutorial/index.md


  - 打赏捐赠:
      - 打赏捐赠: donate/index.md      



extra_css:

  - css/custom.css

  - stylesheets/extra.css


extra_javascript:

  - js/home.js



copyright:

  Copyright © 2026 爱果核资源库



extra:

  generator: false
