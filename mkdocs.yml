site_name: K资源仓

site_url: https://kzyc.de5.net/

theme:
  name: material
  logo: assets/images/logo.png
  font:
    text: Roboto
    code: Roboto Mono
  language: zh

  custom_dir: docs/overrides

  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking

  palette:                                 # 👈 顶部添加改变明暗开关
    
    # Palette toggle for light mode
    - scheme: default
      primary: white
      accent: white
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode    


plugins:

  - search:
      lang:
        - zh
  
  - tags:
      tags_file: tags.md

  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      pagination: true
      pagination_per_page: 10
      # 开启原生：首页、上一页、数字页码、下一页、尾页
      pagination_format: "$link_first $link_previous ~2~ $link_next $link_last"
      
  
      
    


markdown_extensions:

  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight


nav:                             # 👈 首页顶部导航

  - 首页:
      - 首页: index.md

  - 最新发布:
      - 最新发布: blog/index.md

  - 电脑软件:
      - 电脑软件: blog/category/software/


  - 安卓软件:
      - 安卓软件: blog/category/software/


  - 免费字体:
      - 免费字体: blog/category/software/


  - 操作系统:
      - 操作系统: blog/category/software/


  - 视频教程:
      - 视频教程: blog/category/software/


  - 其他:
      - 其他: blog/category/software/


  - 打赏:
      - 打赏: vip.md      



extra_css:

  - css/custom.css

  - css/auth.css

  - stylesheets/extra.css


extra_javascript:

  - js/home.js

  - js/auth.js



copyright:

  Copyright © 2026 K资源仓



extra:

  generator: false
