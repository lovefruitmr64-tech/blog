<footer class="custom-footer home-only-footer">

    <style>
        /* 核心修复：消除单向 margin 与 gap 干扰，让分隔线绝对居中对称 */
        .footer-links {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0 !important; /* 清除 flex 间距干扰 */
        }
        .footer-links a {
            color: inherit;
            text-decoration: none;
            margin: 0 !important; /* 清除 a 标签单向右边距 */
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        .footer-links a:hover {
            opacity: 1;
        }
        /* 关键：给竖线设置完全一致的左右间距（左右各 14px） */
        .footer-links a:not(:last-child)::after {
            content: "|";
            display: inline-block;
            margin: 0 14px !important; /* 上下0，左右严格对称各 14px */
            opacity: 0.35; /* 半透明淡化，视觉更高级 */
            font-weight: 300;
            pointer-events: none;
        }
    </style>

    <!-- 第一排 + 第二排 -->
    <div class="footer-top">
        <div class="footer-top-inner">

            <!-- 第一排 -->
            <div class="footer-first-row">
                <div class="footer-runtime" id="site-runtime">
                    本站已稳定运行：计算中...
                </div>

                <div class="footer-links">
                    <a href="https://kzyc.de5.net/Submission-Instructions">投稿说明</a>
                    <a href="https://kzyc.de5.net/Copyright/">版权声明</a>
                    <a href="https://kzyc.de5.net/Download-Instructions/">下载说明</a>
                    <a href="https://kzyc.de5.net/blog/">sitemap</a>
                </div>
            </div>

            <!-- 第二排 -->
            <div class="footer-statistics">
                <span>
                    📊 今日访问 <strong id="busuanzi_today_pv">--</strong>
                </span>
                <span class="stat-divider">·</span>
                <span>
                    👤 今日访客 <strong id="busuanzi_today_uv">--</strong>
                </span>
                <span class="stat-divider">·</span>
                <span>
                    🌐 总访问 <strong id="busuanzi_site_pv">--</strong>
                </span>
            </div>

        </div>
    </div>

    <!-- 黑色版权区域 -->
    <div class="footer-bottom">
        <div class="footer-bottom-inner">
            Copyright © 2026 K资源仓&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            本站所有资源收集整理于国内外站点，如不慎侵犯了您的权利，请联系邮箱ifruitmr@126.com删除
        </div>
    </div>

    <!-- 网站运行时间 -->
    <script>
        (function(){
            const startTime = new Date('2026-01-01T00:00:00+08:00').getTime();

            function updateRuntime(){
                const now = new Date().getTime();
                const diff = now - startTime;
                if(diff < 0) return;

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById("site-runtime").innerHTML =
                    `本站已稳定运行：${days} 天 ${hours} 小时 ${minutes} 分 ${seconds} 秒`;
            }

            updateRuntime();
            setInterval(updateRuntime, 1000);
        })();
    </script>

    <!-- 网站访问统计（已切换为专属独立域名，手机与国内网络秒级畅通） -->
    <script>
        (function () {
            fetch("https://stats.kzyc.de5.net/stats")
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    document.getElementById("busuanzi_today_pv").textContent = data.today_pv ?? 0;
                    document.getElementById("busuanzi_today_uv").textContent = data.today_uv ?? 0;
                    document.getElementById("busuanzi_site_pv").textContent = data.total_pv ?? 0;
                })
                .catch(function () {
                    console.log("统计数据暂时无法获取");
                });
        })();
    </script>
