<script>


(function(){


const startTime =
new Date('2026-01-01T00:00:00+08:00').getTime();



function updateRuntime(){


const now =
new Date().getTime();



const diff =
now-startTime;



if(diff<0)return;



const days =
Math.floor(diff/(1000*60*60*24));



const hours =
Math.floor(
(diff%(1000*60*60*24))
/(1000*60*60)
);



const minutes =
Math.floor(
(diff%(1000*60*60))
/(1000*60)
);



const seconds =
Math.floor(
(diff%(1000*60))
/1000
);



document.getElementById("site-runtime").innerHTML =

`本站已稳定运行：${days} 天 ${hours} 小时 ${minutes} 分 ${seconds} 秒`;



}



updateRuntime();


setInterval(updateRuntime,1000);



})();


</script>
