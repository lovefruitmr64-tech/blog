<!-- ============================================================
     2. 页面头部扩展区域
     ============================================================ -->
{% block extrahead %}
{{ super() }}

<!-- A. 外部图标与统计追踪（原版完整保留） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
<script defer src="https://cloud.umami.is/script.js" data-website-id="ee3ed10d-72ae-4d3a-b6dd-6b457fb189cd"></script>
<script>
(function () {
  let visitorId = localStorage.getItem("kzyc_visitor_id");

  if (!visitorId) {
    visitorId =
      Date.now().toString(36) +
      Math.random().toString(36).substring(2);

    localStorage.setItem("kzyc_visitor_id", visitorId);
  }

  fetch(
    "https://kzyc-stats.lovefruitmr65.workers.dev/track?vid=" +
      encodeURIComponent(visitorId)
  );
})();
</script>

<!-- B. 标题底框、文章卡片与明暗模式样式（原版完整保留） -->
<style>
  /* 
   * 1. 标题专属底框卡片：基础结构（宽度 100% 对齐、圆角、内边距、居中）
   */
  .category-title-card,
  h1:has(+ .blog-post-grid),
  .md-content:has(.blog-post-grid) h1:first-of-type,
  h1#software,
  h1#android,
  h1#fonts,
  h1#os,
  h1#tutorials,
  h1#others {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    border-radius: 14px !important;
    padding: 10px 18px !important;
    margin: 14px 0 18px 0 !important;
    text-align: center !important;
    display: block !important;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease !important;
  }

  /* ☀️ 默认 / 明亮模式 (Light Mode) */
  [data-md-color-scheme="default"] .category-title-card,
  [data-md-color-scheme="default"] h1:has(+ .blog-post-grid),
  [data-md-color-scheme="default"] .md-content:has(.blog-post-grid) h1:first-of-type,
  .category-title-card,
  h1:has(+ .blog-post-grid),
  .md-content:has(.blog-post-grid) h1:first-of-type {
    background: #ffffff !important;
    color: #1e293b !important;
    border: 1px solid rgba(127, 127, 127, 0.22) !important;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04) !important;
  }

  /* 🌙 暗黑模式 (Dark Mode - Slate) */
  [data-md-color-scheme="slate"] .category-title-card,
  [data-md-color-scheme="slate"] h1:has(+ .blog-post-grid),
  [data-md-color-scheme="slate"] .md-content:has(.blog-post-grid) h1:first-of-type,
  [data-md-color-scheme="slate"] h1#software,
  [data-md-color-scheme="slate"] h1#android,
  [data-md-color-scheme="slate"] h1#fonts,
  [data-md-color-scheme="slate"] h1#os,
  [data-md-color-scheme="slate"] h1#tutorials,
  [data-md-color-scheme="slate"] h1#others {
    background: #1f232b !important; /* 暗黑卡片底色，与背景融为一体 */
    color: #f1f5f9 !important;      /* 高清亮白文字 */
    border: 1px solid rgba(255, 255, 255, 0.12) !important; /* 细腻微光描边 */
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35) !important;
  }

  /* 
   * 2. 纯 CSS 级汉化：字号精确对齐【最新发布】大小（1.05rem, font-weight: 700）
   */
  h1#software { font-size: 0 !important; }
  h1#software::before { content: "电脑软件" !important; font-size: 1.05rem !important; font-weight: 700 !important; }

  h1#android { font-size: 0 !important; }
  h1#android::before { content: "安卓软件" !important; font-size: 1.05rem !important; font-weight: 700 !important; }

  h1#fonts { font-size: 0 !important; }
  h1#fonts::before { content: "免费字体" !important; font-size: 1.05rem !important; font-weight: 700 !important; }

  h1#os { font-size: 0 !important; }
  h1#os::before { content: "操作系统" !important; font-size: 1.05rem !important; font-weight: 700 !important; }

  h1#tutorials { font-size: 0 !important; }
  h1#tutorials::before { content: "视频教程" !important; font-size: 1.05rem !important; font-weight: 700 !important; }

  h1#others { font-size: 0 !important; }
  h1#others::before { content: "其他资源" !important; font-size: 1.05rem !important; font-weight: 700 !important; }

  /* 
   * 3. 文章卡片明暗模式同步自适应
   */
  /* 明亮模式卡片 */
  .post-card {
    background: #ffffff !important;
    border: 1px solid rgba(127, 127, 127, 0.22) !important;
    border-radius: 14px !important;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04) !important;
    transition: all 0.25s ease !important;
    overflow: hidden !important;
  }
  .post-card:hover {
    transform: translateY(-3px) !important;
    border-color: rgba(37, 99, 235, 0.45) !important;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08) !important;
  }

  /* 暗黑模式卡片 */
  [data-md-color-scheme="slate"] .post-card {
    background: #1f232b !important;
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35) !important;
  }
  [data-md-color-scheme="slate"] .post-card:hover {
    border-color: rgba(96, 165, 250, 0.45) !important;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5) !important;
  }

  /* 卡片上的分类小胶囊标签同步汉化 */
  .post-category[title*="software"] { font-size: 0 !important; }
  .post-category[title*="software"]::before { content: "电脑软件" !important; font-size: 0.72rem !important; font-weight: 600 !important; }

  .post-category[title*="android"] { font-size: 0 !important; }
  .post-category[title*="android"]::before { content: "安卓软件" !important; font-size: 0.72rem !important; font-weight: 600 !important; }

  .post-category[title*="fonts"] { font-size: 0 !important; }
  .post-category[title*="fonts"]::before { content: "免费字体" !important; font-size: 0.72rem !important; font-weight: 600 !important; }

  .post-category[title*="os"] { font-size: 0 !important; }
  .post-category[title*="os"]::before { content: "操作系统" !important; font-size: 0.72rem !important; font-weight: 600 !important; }

  .post-category[title*="tutorials"] { font-size: 0 !important; }
  .post-category[title*="tutorials"]::before { content: "视频教程" !important; font-size: 0.72rem !important; font-weight: 600 !important; }
</style>

<!-- C. 自动注入后台配置（由 hooks.py 从 docs/admin/index.md 提取） -->
{% if config.extra.site_admin_config %}
  <script>
    window.SITE_ADMIN_CONFIG = {{ config.extra.site_admin_config | tojson }};
  </script>
{% endif %}

<!-- D. 全功能核心脚本：网页标签页 Title 同步 + 后台动态汉化 + 顶部导航悬浮下拉子菜单 -->
<script>
(function() {
  // 基础兜底分类（保留你原本已有的各项分类）
  const defaultCategoryMap = {
    "software": "电脑软件",
    "android": "安卓软件",
    "fonts": "免费字体",
    "os": "操作系统",
    "tutorials": "视频教程",
    "others": "其他资源"
  };

  function applyAdminAndMeta() {
    const cfg = window.SITE_ADMIN_CONFIG || {};
    // 将后台 admin/index.md 中新配置的分类无缝合并进来
    const enToZh = Object.assign({}, defaultCategoryMap, cfg.categories_en_to_zh || {});
    const navDropdowns = cfg.nav_dropdowns || {};

    // -------------------------------------------------------------
    // 1. 同步更新网页标签页 Title（你原有的 JS 双保险功能）
    // -------------------------------------------------------------
    const path = window.location.pathname.toLowerCase();
    for (const key in enToZh) {
      if (path.indexOf(key) !== -1) {
        if (document.title.toLowerCase().includes(key)) {
          document.title = document.title.replace(new RegExp(key, "gi"), enToZh[key]);
        }
        break;
      }
    }

    // -------------------------------------------------------------
    // 2. 动态汉化分类页标题与卡片标签（支持后续在后台随时增加的新分类）
    // -------------------------------------------------------------
    const h1 = document.querySelector(".md-content h1");
    if (h1) {
      const text = h1.textContent.trim().toLowerCase();
      if (enToZh[text]) {
        h1.textContent = enToZh[text];
      }
    }

    document.querySelectorAll(".post-category, .md-tag, .md-post__meta a").forEach(function(el) {
      const t = el.textContent.trim().toLowerCase();
      if (enToZh[t]) {
        el.textContent = enToZh[t];
      }
    });

    // -------------------------------------------------------------
    // 3. 顶部导航栏悬浮下拉子菜单自动构建（读取后台 nav_dropdowns）
    // -------------------------------------------------------------
    document.querySelectorAll(".md-tabs__item").forEach(function(tab) {
      const link = tab.querySelector(".md-tabs__link");
      if (!link) return;

      const tabTitle = link.textContent.trim();

      if (navDropdowns[tabTitle] && !tab.querySelector(".kzyc-dropdown-menu")) {
        const ul = document.createElement("ul");
        ul.className = "kzyc-dropdown-menu";

        navDropdowns[tabTitle].forEach(function(sub) {
          const li = document.createElement("li");
          li.className = "kzyc-dropdown-item";
          const a = document.createElement("a");
          a.href = sub.url;
          a.textContent = sub.name;
          li.appendChild(a);
          ul.appendChild(li);
        });

        tab.appendChild(ul);
      }
    });
  }

  // 初次加载与 Material 即时切换监听
  applyAdminAndMeta();
  if (typeof document$ !== "undefined") {
    document$.subscribe(applyAdminAndMeta);
  }
})();
</script>
{% endblock %}
