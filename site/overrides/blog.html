{#- Blog layout override -#}

{% extends "main.html" %}

{% block container %}

{{ page.content }}

<div class="blog-post-grid">

  {% for post in posts %}
    {% include "partials/post.html" %}
  {% endfor %}

</div>

{% if pagination %}
  {% block pagination %}
    {% include "partials/pagination.html" %}
  {% endblock %}
{% endif %}

{% endblock %}
